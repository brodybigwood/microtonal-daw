<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microtonal DAW</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    canvas { display: block; border: none; }
    #loading {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        color: #e0e0e0; font-family: sans-serif; font-size: 18px; z-index: 10;
        text-align: center;
    }
    #loading .spinner {
        width: 40px; height: 40px; margin: 0 auto 16px;
        border: 3px solid #333; border-top-color: #8af; border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #output {
        position: fixed; bottom: 0; left: 0; right: 0; height: 120px;
        background: rgba(0,0,0,0.85); color: #f44; font: 11px monospace;
        overflow-y: auto; padding: 6px; z-index: 20; display: none;
        white-space: pre-wrap; word-break: break-all;
    }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div>Loading...</div>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
<pre id="output"></pre>
<script>
(function() {
    function resumeAudio() {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { logOutput('[AUDIO] Web Audio not supported'); return; }
        var ctx = new AC();
        logOutput('[AUDIO] AudioContext state=' + ctx.state);
        if (ctx.state === 'suspended') {
            ctx.resume().then(function() {
                logOutput('[AUDIO] resumed, new state=' + ctx.state);
                ctx.close();
            }).catch(function(e) {
                logOutput('[AUDIO] resume failed: ' + e);
            });
        } else {
            ctx.close();
        }
    }
    document.addEventListener('pointerdown', resumeAudio, { once: true });
    document.addEventListener('keydown', resumeAudio, { once: true });
})();
</script>
<script>
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());

var canvasElement = document.getElementById('canvas');
canvasElement.addEventListener('webglcontextlost', e => e.preventDefault(), false);

var outputEl = document.getElementById('output');
function logOutput(text) {
    outputEl.style.display = 'block';
    outputEl.textContent += text + '\n';
    outputEl.scrollTop = outputEl.scrollHeight;
}

var Module = {
    canvas: canvasElement,
    print: text => logOutput(text),
    printErr: text => logOutput('[ERR] ' + text),
    setStatus: text => {
        var loading = document.getElementById('loading');
        if (loading) loading.innerHTML = '<div class="spinner"></div>' + text;
    },
    onRuntimeInitialized: () => {
        const loading = document.getElementById('loading');
        if (loading) loading.remove();
        canvasElement.style.width = '100vw';
        canvasElement.style.height = '100vh';
    }
};
</script>
<script src="DAW.js"></script>
</body>
</html>
